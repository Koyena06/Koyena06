name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats images
        run: |
          mkdir -p stats

          fetch() {
            url="$1"; out="$2"
            for i in 1 2 3 4 5; do
              if curl -fsSL --max-time 60 "$url" -o tmp.svg \
                 && grep -q "<svg" tmp.svg \
                 && ! grep -qiE "something went wrong|rate limit" tmp.svg; then
                mv tmp.svg "$out"
                echo "Updated $out"
                return 0
              fi
              sleep 20
            done
            echo "Failed to update $out, keeping the old one"
          }

          fetch "https://github-readme-stats-sigma-five.vercel.app/api?username=Koyena06&show_icons=true&theme=rose_pine&hide_border=true&include_all_commits=true&count_private=true" stats/stats.svg
          fetch "https://streak-stats.demolab.com?user=Koyena06&theme=rose-pine&hide_border=true" stats/streak.svg
          fetch "https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=Koyena06&layout=compact&theme=rose_pine&hide_border=true" stats/top-langs.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "chore: update stats"
          git push